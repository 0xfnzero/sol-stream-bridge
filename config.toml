# 本机：同时转发两路 shred 和 Yellowstone gRPC。
# 把 203.0.113.10 替换为目标服务器 IP；文件路径相对于启动工作目录。
role = "source"

# jito-shredstream-proxy 的 --dest-ip-ports 指向 127.0.0.1:20000。
[[shred]]
name = "jito"
listen = "127.0.0.1:20000"
targets = ["203.0.113.10:20000"]
allowed_sources = ["127.0.0.1"]
receive_buffer = 8388608

# 外部提供方通过 IP:端口推送的原始 UDP shred。
[[shred]]
name = "raw-shred"
listen = "0.0.0.0:20001"
targets = ["203.0.113.10:20001"]
# 改为实际提供方 IP；空数组允许任意来源。
allowed_sources = ["192.0.2.20"]
receive_buffer = 8388608

[grpc]
tunnel_address = "203.0.113.10:19000"
upstream = "127.0.0.1:10000"
token_env = "BRIDGE_TOKEN"
insecure = false
# 必须与目标服务器隧道 TLS 证书的 SAN 匹配。
server_name = "bridge.example.com"
# 自签证书时指定；使用公共 CA 签发的证书可删除此行。
ca_file = "certs/tunnel-cert.pem"
idle_tunnels = 8
max_connections = 256
reconnect_ms = 1000
connect_timeout_ms = 10000
