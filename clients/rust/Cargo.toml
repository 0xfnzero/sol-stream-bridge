[package]
name = "stream-bridge-client"
version = "0.1.0"
edition = "2021"
description = "Bot client SDK for receiving Solana Shred packets and typed Yellowstone gRPC updates"
license = "MIT"
repository = "https://github.com/0xfnzero/stream-bridge"
documentation = "https://docs.rs/stream-bridge-client"
readme = "README.md"
keywords = ["solana", "shred", "yellowstone", "grpc", "bot"]
categories = ["network-programming", "asynchronous"]
include = ["/src/**", "/examples/**", "/Cargo.toml", "/README.md", "/LICENSE", "/client.toml"]

[features]
yellowstone = ["dep:yellowstone-grpc-client", "dep:yellowstone-grpc-proto", "dep:futures"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
tokio = { version = "1", features = ["net", "sync", "rt"] }
futures = { version = "0.3", optional = true }
yellowstone-grpc-client = { version = "12.2", optional = true }
yellowstone-grpc-proto = { version = "12.7", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[[example]]
name = "receive_client"
required-features = ["yellowstone"]

[package.metadata.docs.rs]
all-features = true
