name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: clients/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: cargo fmt --check && cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: go test -race ./... && go vet ./...
        working-directory: clients/go
      - run: npm ci && npm run build && npm test
        working-directory: clients/typescript
      - run: python3 tools/smoke_clients.py
      - run: python3 -m unittest discover -s tests -p 'test_install.py'
